spring.application.name=medical-system
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# External local credentials are optional and excluded from Git and the Jar.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
mybatis.configuration.map-underscore-to-camel-case=true
